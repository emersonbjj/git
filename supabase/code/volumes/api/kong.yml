_format_version: '2.1'
_transform: true

consumers:
  - username: DASHBOARD
  - username: anon
    keyauth_credentials:
      - key: $SUPABASE_ANON_KEY
  - username: service_role
    keyauth_credentials:
      - key: $SUPABASE_SERVICE_KEY

acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

basicauth_credentials:
  - consumer: DASHBOARD
    username: $DASHBOARD_USERNAME
    password: $DASHBOARD_PASSWORD

services:
  # ─── Auth ───────────────────────────────────────────────
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
      - name: key-auth
      - name: acl
        config:
          allow:
            - admin
            - anon

  # ─── PostgREST ──────────────────────────────────────────
  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
      - name: key-auth
      - name: acl
        config:
          allow:
            - admin
            - anon

  # ─── Realtime REST (deve vir ANTES da rota WS) ──────────
  - name: realtime-v1-rest
    url: http://realtime:4000/api
    routes:
      - name: realtime-v1-rest
        strip_path: true
        regex_priority: 200
        paths:
          - /realtime/v1/api
    plugins:
      - name: cors
      - name: request-transformer
        config:
          replace:
            headers:
              - "Host:realtime-dev.localhost"
          add:
            headers:
              - "X-Forwarded-Host:realtime-dev.localhost"

  # ─── Realtime WebSocket ─────────────────────────────────
  # Realtime resolve o tenant pelo PRIMEIRO segmento do Host.
  # Reescrevemos para "realtime-dev.localhost" -> tenant external_id = "realtime-dev".
  - name: realtime-v1-ws
    url: http://realtime:4000/socket
    routes:
      - name: realtime-v1-ws
        strip_path: true
        regex_priority: 100
        paths:
          - /realtime/v1/
        protocols:
          - http
          - https
    plugins:
      - name: cors
      - name: request-transformer
        config:
          replace:
            headers:
              - "Host:realtime-dev.localhost"
          add:
            headers:
              - "X-Forwarded-Host:realtime-dev.localhost"
              - "X-Forwarded-Proto:https"

  # ─── Storage ────────────────────────────────────────────
  - name: storage-v1
    url: http://storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors

  # ─── Edge Functions ─────────────────────────────────────
  - name: functions-v1
    url: http://functions:9000/
    routes:
      - name: functions-v1-all
        strip_path: true
        paths:
          - /functions/v1/
    plugins:
      - name: cors

  # ─── Dashboard (Studio) ─────────────────────────────────
  - name: dashboard
    url: http://studio:3000/
    routes:
      - name: dashboard-all
        strip_path: true
        paths:
          - /
    plugins:
      - name: cors
      - name: basic-auth
